[package]
name = "wayclip-daemon"
version = "0.2.0"
edition = "2024"
description = "Recording and management of Wayclip daemon"
readme = "README.md"
repository = "https://github.com/Wayclip/daemon"
license = "MIT"
rust-version = "1.88"

[dependencies]
ashpd = {
  version = "0.13.11",
  features = [
    "backend",
    "frontend",
    "pipewire",
    "tokio",
    "tracing",
  ]
}
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-gl = "0.25.2"
gstreamer-gl-egl = "0.25.0"
gstreamer-video = { version = "0.25", features = ["v1_24"] }
ksni = "0.3.6"
libc = "0.2.189"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
log = "0.4.33"
parking_lot = "0.12.5"
sd-notify = "0.5.0"
serde = "1.0.228"
serde_json = "1.0.150"
strum_macros = "0.28.0"
sysinfo = "0.39.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.19"
url = { version = "2.5.8", features = ["serde"] }
wayclip-core = { version = "0.1.4", features = ["errors", "daemon"] }
wayclip-global-hotkey = "0.7.0"
zbus = { version = "5.16.0", default-features = false, features = ["blocking"] }

[features]
default = ["linux"]
linux = []
windows = []
