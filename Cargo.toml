[package]
name = "wayclip-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-pbutils = "0.25.2"
log = "0.4.33"
ashpd = { version = "0.13.11", features = [
  "pipewire",
  "tracing",
  "tokio",
  "backend",
  "frontend",
] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.32"
futures-util = "0.3.32"
gilrs = "0.11.2"
ksni = "0.3.6"
nanoid = "0.5.0"
pipewire = "0.9.0"
sd-notify = "0.5.0"
serde = "1.0.228"
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = "0.39.3"
tokio = { version = "1.52.3", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
wayclip-global-hotkey = "0.7.0"
zbus = { version = "5.16.0", default-features = false, features = ["blocking"] }
mpsc = "0.3.0"
discord-rich-presence = "1.1.0"
rodio = "0.22.2"
# I will 100% move to a crate (version magement better)
wayclip-core = { git = "https://github.com/Wayclip/core", default-features = false, features = [
  "errors",
] }
tokio-util = "0.7.19"

[features]
default = []
windows = []
linux = []
